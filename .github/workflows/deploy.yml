
name: Deploy to Railway

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -v

      - name: Build Docker image
        run: docker build -t team-api .

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set version to Git commit SHA
        run: echo "${GITHUB_SHA}" > app/version.txt

      - name: Install Railway CLI
        run: npm install -g @railway/cli@5.71.0

      - name: Deploy to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_SERVICE: ${{ vars.RAILWAY_SERVICE }}
        run: railway up --service "$RAILWAY_SERVICE" --ci

  smoke-test:
    name: smoke-test
    needs: deploy
    if: vars.APP_URL != ''
    runs-on: ubuntu-latest

    steps:
      - name: Check deployed application
        env:
          APP_URL: ${{ vars.APP_URL }}
          EXPECTED_VERSION: ${{ github.sha }}
        run: |
          for i in {1..30}; do
            response=$(curl -fsS "$APP_URL/health" || true)

            if [ -n "$response" ]; then
              actual_version=$(echo "$response" | jq -r '.version')

              if [ "$actual_version" = "$EXPECTED_VERSION" ]; then
                echo "Deployment verified successfully!"
                echo "$response"
                exit 0
              fi
            fi

            echo "Waiting for the application... Attempt $i/30"
            sleep 10
          done

          echo "Deployment health check failed."
          exit 1
